name: Create release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid release version. Release tags must look like v1.2.0 (a 'v' followed by three numbers separated by dots, no extra characters). Delete this tag/release and re-tag with the correct format. See docs/releasing.md."
            exit 1
          fi
          echo "Tag '$TAG' is valid."

      - name: Checkout the target Git reference
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # The Docker image push to ghcr.io is currently skipped: the repository's
      # GITHUB_TOKEN is denied `write_package` on ghcr.io (release run failed with
      # `denied: permission_denied: write_package`), which made the whole release fail
      # even though the binaries built fine. Skipping Docker keeps the release green and
      # still ships all binaries. To re-enable image publishing, grant the GITHUB_TOKEN
      # package write access (Repo Settings -> Actions -> General -> Workflow permissions
      # -> "Read and write permissions") and remove the `--skip=docker` flag below.
      # See docs/releasing.md.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: release --skip=docker
